<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo table sử dụng thuộc tính rowspan</title>
</head>
<body>
    <table border="1" cellspacing="10" cellpadding="10">
        <tr>
            <th><b>Loại Sản Phẩm</b></th>
            <th><b>Tên Sản Phẩm</b></th>
            <th><b>Giá</b></th>
        </tr>
        <tr>
            <td rowspan="2">Điện Tử</td>
            <td>Laptop</td>
            <td>15.000.000</td>
        </tr>
        <tr>
            <td>Điện thoại</td>
            <td>8.000.000</td>
        </tr>
        <tr>
            <td>Gia Dụng</td>
            <td>Máy Giặt</td>
            <td>5.000.000</td>
        </tr>
    </table>
    
</body>
</html>
