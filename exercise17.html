<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo table sử dụng thuộc tính colspan</title>
</head>
<body>
    <table border="1" cellspacing="10" cellpadding="10">
        <tr>
            <th><b>Tháng</b></th>
            <th colspan="2"><b>Tỷ lệ Đơn Hàng theo tháng</b></th>
        </tr>
        <tr>
            <td>Nguyễn Văn A</td>
            <td>15% Hoàn Thành</td>
            <td>85% Hủy Hàng</td>
        </tr>
        <tr>
            <td>Phan Văn B</td>
            <td>25% Hoàn Thành</td>
            <td>75% Hủy Hàng</td>
        </tr>
        <tr>
            <td>Nguyễn Thị C</td>
            <td>50% Hoàn Thành</td>
            <td>50% Hủy Hàng</td>
        </tr>
    </table>
    
</body>
</html>
