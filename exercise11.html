        <h2><b>Car Purchase From</b></h2>
        <from>
        <lable for="name">Name</lable>
        <input id="name" type="text" name="name">
        <br>
        <laber for="Email">Email:</laber>
        <input id="Email" type="text" name="Email">
        <br>
        <laber for="Phone">Phone:</laber>
        <input id="Phone" type="text" name="Phone">
        <br>
        <laber for="car">Choose a Car:</laber>
        <select id="car" name="car">
            <option value="model1">model1</option>
            <option value="model2">model2</option>
            <option value="model3">model3</option>
        </select>
        <br>
        <laber for="color">Choose a Color:</laber>
        <select id="color" name="color">
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Yellow">Yellow</option>
        </select>
        <br>
        <lable for="quantity">Quantity:</lable>
        <input id="number" type="quantity" name="quantity" min="1" max="100">
        <br>
        <laber for="Date">Delivery Date:</laber>
        <input id="date" type="date" name="date">
        <br>
