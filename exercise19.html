
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sở thích của bạn</title>
</head>
<body>

    <form>
        <table border="1" cellpadding="8" align="center">
            <tr>
                <th colspan="2" bgcolor="orange">SỞ THÍCH CỦA BẠN</th>
            </tr>

            <tr>
                <td align="right"><font color="blue">Họ và tên</font></td>
                <td>
                    <input type="text" name="name" size="40">
                </td>
            </tr>

            <tr>
                <td align="right"><font color="blue">Email</font></td>
                <td>
                    <input type="email" name="email" size="30">
                </td>
            </tr>

            <tr>
                <td valign="top" align="right"><font color="blue">Sở thích</font></td>
                <td>
                    <font color="orange">
                    <table>
                        <tr>
                            <td>
                                <input type="checkbox" name="sothich" value="thethao">
                                Thể thao
                            </td>
                            <td>
                                <input type="checkbox" name="sothich" value="amnhac">
                                Âm nhạc
                            </td>
                            <td>
                                <input type="checkbox" name="sothich" value="docsach">
                                Đọc sách
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <input type="checkbox" name="sothich" value="luotweb">
                                Lướt web
                            </td>
                            <td>
                                <input type="checkbox" name="sothich" value="choigame">
                                Chơi game
                            </td>
                            <td>
                                <input type="checkbox" name="sothich" value="dienanh">
                                Điện ảnh
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <input type="checkbox" name="sothich" value="dulich">
                                Du lịch
                            </td>
                        </tr>
                    </table>
                    </font>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Gửi thông tin</button>
                    <button type="reset">Nhập lại</button>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
